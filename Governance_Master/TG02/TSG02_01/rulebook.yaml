compounds:
- id: C_MOS
  question: Is the transaction a supply?
  includes:
  - LE_SIAFOS
  overrides:
  - IH_NGNS
  produces:
  - product: PD_TIAS
    from:
    - LE_SIAFOS
  gate: PD_TIAS
- id: C_TOS
  question: Is the supply goods or services?
  includes:
  - LE_SOG
  - LE_SOS
  exclusive:
  - LE_SOG
  - LE_SOS
  produces:
  - product: PD_SOG
    from:
    - LE_SOG
  - product: PD_SOS
    from:
    - LE_SOS
- id: C_SIIOS
  question: 'Section 7(1)(b): Supply Includes Import Of Services?'
  includes:
  - LE_SIIOS
  produces:
  - product: PD_SIIOS
    from:
    - LE_SIIOS
- id: C_SMAOTG
  question: 'Section 2(102): Services Means Anything Other Than Goods?'
  includes:
  - LE_SERVICES
  - LE_NOT_SERVICES
  - LE_CONTEXT_DISPLACED
  produces:
  - product: PD_SERVICES
    from:
    - LE_SERVICES
  - product: PD_NOT_SERVICES
    from:
    - LE_NOT_SERVICES
  - product: PD_CONTEXT_DISPLACED
    from:
    - LE_CONTEXT_DISPLACED
- id: C_S2_C31
  question: 'Section 2(31): which clause applies?'
  includes:
  - LE_CONSIDERATION_INCLUDES
  - LE_SUBSIDY_EXCLUDED
  - LE_CIMV_INCLUDES
  - LE_CIMV_SUBSIDY_EXCLUDED
  produces:
  - product: PD_CONSIDERATION_INCLUDES
    from:
    - LE_CONSIDERATION_INCLUDES
  - product: PD_SUBSIDY_EXCLUDED
    from:
    - LE_SUBSIDY_EXCLUDED
  - product: PD_CIMV_INCLUDES
    from:
    - LE_CIMV_INCLUDES
  - product: PD_CIMV_SUBSIDY_EXCLUDED
    from:
    - LE_CIMV_SUBSIDY_EXCLUDED
- id: C_GMMP
  question: 'Section 2(52): Goods Means Movable Property?'
  includes:
  - LE_GOODS
  produces:
  - product: PD_GOODS
    from:
    - LE_GOODS
- id: C_IOSFRP
  question: 'Schedule I, paragraph 4: Import Of Services From Related Person?'
  includes:
  - LE_IOSFRP
  produces:
  - product: PD_IOSFRP
    from:
    - LE_IOSFRP
- id: C_OMVOS
  question: 'Rule 27(a): Open Market Value Of Supply?'
  includes:
  - LE_OMV
  produces:
  - product: PD_OMV
    from:
    - LE_OMV
- id: C_2018_PA1
  question: 'Paragraph 1: which clause applies?'
  includes:
  - LE_DRSLT
  - LE_CLASS
  - LE_LIABILITY_TIME
  produces:
  - product: PD_DRSLT
    from:
    - LE_DRSLT
  - product: PD_CLASS
    from:
    - LE_CLASS
  - product: PD_LIABILITY_TIME
    from:
    - LE_LIABILITY_TIME
- id: C_SITIS
  question: 'Section 2(102) Explanation: Services Includes Transactions In Securities?'
  includes:
  - LE_SITIS_SERVICES_INCLUDES_ACTIVITY
  produces:
  - product: PD_SITIS_SERVICES_INCLUDES_ACTIVITY
    from:
    - LE_SITIS_SERVICES_INCLUDES_ACTIVITY
- id: C_SMORR
  question: 'Rule 31, first proviso: Supplier May Opt Residual Rule?'
  includes:
  - LE_SMORR
  produces:
  - product: PD_SMORR
    from:
    - LE_SMORR
- id: C_DNPUA
  question: 'Section 2(31), proviso: Deposit Not Payment Unless Applied?'
  includes:
  - LE_DEPOSIT_NOT_PAYMENT
  produces:
  - product: PD_DEPOSIT_NOT_PAYMENT
    from:
    - LE_DEPOSIT_NOT_PAYMENT
precedents:
- id: KR_FADIB
  statement: Fixed asset disposal to a customer is in the course of business
  predicate: A_SIMICOFOB
  decisive_facts:
  - F_GLA
  - F_RT
  when: F_GLA = 'FIXED_ASSET' AND F_RT = 'CUSTOMER'
  value: true
  scope: global
  rulebook_version: TSG02_01
- id: KR_RIIB
  statement: Rent income from a customer is in the course of business
  predicate: A_SIMICOFOB
  decisive_facts:
  - F_GLA
  - F_RT
  when: F_GLA = 'RENT_INCOME' AND F_RT = 'CUSTOMER'
  value: true
  scope: global
  rulebook_version: TSG02_01
