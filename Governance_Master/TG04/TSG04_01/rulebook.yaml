compounds:
- id: C_MOS
  question: Is the transaction a supply?
  includes:
  - LE_SIAFOS
  overrides:
  - IH_NGNS
  produces:
  - product: PD_TIAS
    from:
    - LE_SIAFOS
  gate: PD_TIAS
- id: C_TOS
  question: Is the supply goods or services?
  includes:
  - LE_SOG
  - LE_SOS
  exclusive:
  - LE_SOG
  - LE_SOS
  produces:
  - product: PD_SOG
    from:
    - LE_SOG
  - product: PD_SOS
    from:
    - LE_SOS
- id: C_S2_C31
  question: 'Section 2(31): which clause applies?'
  includes:
  - LE_CONSIDERATION_INCLUDES
  - LE_SUBSIDY_EXCLUDED
  - LE_CIMV_INCLUDES
  - LE_CIMV_SUBSIDY_EXCLUDED
  produces:
  - product: PD_CONSIDERATION_INCLUDES
    from:
    - LE_CONSIDERATION_INCLUDES
  - product: PD_SUBSIDY_EXCLUDED
    from:
    - LE_SUBSIDY_EXCLUDED
  - product: PD_CIMV_INCLUDES
    from:
    - LE_CIMV_INCLUDES
  - product: PD_CIMV_SUBSIDY_EXCLUDED
    from:
    - LE_CIMV_SUBSIDY_EXCLUDED
- id: C_DNPUA
  question: 'Section 2(31), proviso: Deposit Not Payment Unless Applied?'
  includes:
  - LE_DEPOSIT_NOT_PAYMENT
  produces:
  - product: PD_DEPOSIT_NOT_PAYMENT
    from:
    - LE_DEPOSIT_NOT_PAYMENT
- id: C_R27
  question: 'Rule 27: which clause applies?'
  includes:
  - LE_OMV
  - LE_MPEONC
  - LE_VOLKQ
  - LE_VOLKQ_VALUE
  - LE_RESIDUAL_VALUE
  produces:
  - product: PD_OMV
    from:
    - LE_OMV
  - product: PD_MPEONC
    from:
    - LE_MPEONC
  - product: PD_VOLKQ
    from:
    - LE_VOLKQ
  - product: PD_VOLKQ_VALUE
    from:
    - LE_VOLKQ_VALUE
  - product: PD_RESIDUAL_VALUE
    from:
    - LE_RESIDUAL_VALUE
- id: C_2018_PA1
  question: 'Paragraph 1: which clause applies?'
  includes:
  - LE_DRSLT
  - LE_CLASS
  - LE_LIABILITY_TIME
  produces:
  - product: PD_DRSLT
    from:
    - LE_DRSLT
  - product: PD_CLASS
    from:
    - LE_CLASS
  - product: PD_LIABILITY_TIME
    from:
    - LE_LIABILITY_TIME
- id: C_VOSITV
  question: 'Section 15(1): Value Of Supply Is Transaction Value?'
  includes:
  - LE_TV_VALUE
  produces:
  - product: PD_TV_VALUE
    from:
    - LE_TV_VALUE
precedents:
- id: KR_FADIB
  statement: Fixed asset disposal to a customer is in the course of business
  predicate: A_SIMICOFOB
  decisive_facts:
  - F_GLA
  - F_RT
  when: F_GLA = 'FIXED_ASSET' AND F_RT = 'CUSTOMER'
  value: true
  scope: global
  rulebook_version: TSG04_01
- id: KR_RIIB
  statement: Rent income from a customer is in the course of business
  predicate: A_SIMICOFOB
  decisive_facts:
  - F_GLA
  - F_RT
  when: F_GLA = 'RENT_INCOME' AND F_RT = 'CUSTOMER'
  value: true
  scope: global
  rulebook_version: TSG04_01
